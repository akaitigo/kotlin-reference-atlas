name: atlas-validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Non-regression ID mapping source: validate: -> validate_bound:
  validate_bound:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Subject Atlasをcheckout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Reference Atlas Core v1を固定commitでcheckout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: akaitigo/reference-atlas-core
          ref: 072d7ca77981f51754e824d70c6d4ecd55ea67e5
          path: .atlas-core

      - name: Goを設定
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.0"
          cache-dependency-path: .atlas-core/go.sum

      - name: JDK 17を設定
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cacheを設定
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Node 25を設定
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "25.2.1"

      - name: Python 3.14を固定commitで設定
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.0"

      - name: Python依存をhash固定lockから導入・検証
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-ci.lock
          python3 scripts/verify_python_dependency_contract.py --require-runtime

      - name: Core Schemaでatlas validate
        env:
          ATLAS_CORE_DIR: ${{ github.workspace }}/.atlas-core
        run: PATH="$PWD/bin:$PATH" atlas validate atlas.yaml mastery.yaml coverage.yaml sources.lock.yaml skill.package.yaml

      - name: Mastery Contractをatlas audit
        env:
          ATLAS_CORE_DIR: ${{ github.workspace }}/.atlas-core
        run: PATH="$PWD/bin:$PATH" atlas audit .

      - name: Local profileの実装Gateを検証
        env:
          ATLAS_CORE_DIR: ${{ github.workspace }}/.atlas-core
        run: python3 scripts/verify.py --skip-container

  # Non-regression ID mapping source: container: -> container_bound:
  container_bound:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Subject Atlasをcheckout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Reference Atlas Core v1を固定commitでcheckout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: akaitigo/reference-atlas-core
          ref: 072d7ca77981f51754e824d70c6d4ecd55ea67e5
          path: .atlas-core

      - name: Goを設定
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.0"
          cache-dependency-path: .atlas-core/go.sum

      - name: Container profileをnetworkなしで再実行
        run: scripts/container-verify.sh

      - name: 同一Jobの実Container identityとcommitted Graphを検証
        env:
          ATLAS_CORE_DIR: ${{ github.workspace }}/.atlas-core
        run: |
          python3 scripts/verify_evidence_dependency_profile.py --profile container-required
          python3 scripts/test_evidence_dependency_graph.py
          GOCACHE="$PWD/.cache/go-build" go -C .atlas-core run ./cmd/atlas audit "$PWD" --gate evidence-dependency
          python3 scripts/ci_container_runtime_proof.py capture .ci-runtime-proof/container.json

      - name: 同一Job Runtime Proofを後続Gateへ固定
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kotlin-container-runtime-proof
          path: .ci-runtime-proof/container.json
          if-no-files-found: error
          retention-days: 1

  evidence_dependency:
    needs: container_bound
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Subject Atlasをcheckout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Reference Atlas Core v1を固定commitでcheckout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: akaitigo/reference-atlas-core
          ref: 072d7ca77981f51754e824d70c6d4ecd55ea67e5
          path: .atlas-core

      - name: Goを設定
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.0"
          cache-dependency-path: .atlas-core/go.sum

      - name: 同一RunのContainer Runtime Proofを取得
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kotlin-container-runtime-proof
          path: .ci-runtime-proof

      - name: committed Graphを固定Coreでread-only検証
        env:
          ATLAS_CORE_DIR: ${{ github.workspace }}/.atlas-core
        run: |
          python3 scripts/ci_container_runtime_proof.py verify .ci-runtime-proof/container.json
          python3 scripts/test_evidence_dependency_graph.py
          GOCACHE="$PWD/.cache/go-build" go -C .atlas-core run ./cmd/atlas audit "$PWD" --gate evidence-dependency

  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Subject Atlasを全履歴checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Reference Atlas Core v1を固定commitでcheckout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: akaitigo/reference-atlas-core
          ref: 072d7ca77981f51754e824d70c6d4ecd55ea67e5
          path: .atlas-core

      - name: PRの新規commit rangeをDCO検証
        if: github.event_name == 'pull_request'
        run: python3 scripts/verify_dco_range.py --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --checker .atlas-core/scripts/check_dco.py

      - name: pushの新規commit rangeをDCO検証
        if: github.event_name == 'push'
        run: python3 scripts/verify_dco_range.py --base "${{ github.event.before }}" --head "${{ github.sha }}" --checker .atlas-core/scripts/check_dco.py
